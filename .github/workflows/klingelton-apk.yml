# Baut die Android-App "Klingelton Ersteller" (Ordner klingelton/) und stellt die APK als Download bereit:
# Actions → letzter Lauf → Artifacts → klingelton-ersteller-apk
name: Klingelton-App bauen
on:
  push:
    paths: ['klingelton/**', '.github/workflows/klingelton-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klingelton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: ./gradlew assembleRelease lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: klingelton-ersteller-apk
          path: klingelton/app/build/outputs/apk/release/app-release.apk
